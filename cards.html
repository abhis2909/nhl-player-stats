<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Cards — NHL Player Stats</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">🃏</span>
      <div>
        <h1>Player Cards</h1>
        <p class="subtitle" id="seasonLabel">Loading season…</p>
      </div>
    </div>
    <div class="controls">
      <div class="toggle-group" role="tablist" aria-label="Position">
        <button class="toggle-btn active" data-pos="ALL" role="tab" aria-selected="true">All</button>
        <button class="toggle-btn" data-pos="C" role="tab" aria-selected="false">C</button>
        <button class="toggle-btn" data-pos="W" role="tab" aria-selected="false">W</button>
        <button class="toggle-btn" data-pos="D" role="tab" aria-selected="false">D</button>
      </div>
      <label class="visually-hidden" for="teamSelect">Filter by team</label>
      <select id="teamSelect" aria-label="Filter by team">
        <option value="ALL">All Teams</option>
      </select>
      <label class="visually-hidden" for="searchInput">Search players</label>
      <input id="searchInput" type="search" placeholder="Search player…" aria-label="Search players" autocomplete="off">
    </div>
  </div>
  <nav class="site-nav" aria-label="Site">
    <a href="index.html" class="nav-tab">📊 Stats</a>
    <a href="cards.html" class="nav-tab active">🃏 Player Cards</a>
    <a href="admin.html" class="nav-tab">⚙ Columns</a>
  </nav>
</header>

<main>
  <div id="statusBanner" class="status-banner" hidden></div>

  <p class="eligibility-note" id="eligibilityNote"></p>

  <div id="cardsSkeleton" class="cards-skeleton" aria-hidden="true">
    <div class="card-skel"></div>
    <div class="card-skel"></div>
    <div class="card-skel"></div>
  </div>

  <div class="cards-grid" id="cardsGrid"></div>

  <div class="load-more-wrap" id="loadMoreWrap" hidden>
    <button type="button" id="loadMoreBtn" class="ghost-btn">Load more</button>
  </div>

  <p id="resultCount" class="result-count"></p>
</main>

<footer class="site-footer">
  <p>
    Ratings are percentile ranks within this season's qualified skaters (see note above), mapped to a
    55–99 scale — not official NHL or fantasy-provider ratings.
    Data via the unofficial
    <a href="https://api-web.nhle.com/" target="_blank" rel="noopener">NHL API</a>.
  </p>
</footer>

<script src="data.js" defer></script>
<script src="team-colors.js" defer></script>
<script src="cards.js" defer></script>
</body>
</html>
